name: Update latest posts

# Rewrites the latest writing section of README.md from the site's RSS feed. When
# the posts have changed, it opens a pull request and merges it, because main only
# accepts changes through pull requests, with no bypass.
on:
  schedule:
    - cron: "0 20 * * *" # Daily, 07:00 in Melbourne (AEDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: update latest posts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: python3 scripts/update_posts.py

      - name: Merge any changes through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet README.md; then
            echo "No new posts."
            exit 0
          fi
          branch="automation/latest-posts-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update latest posts"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Update latest posts" --body "Automated update from the site's RSS feed."
          gh pr merge "$branch" --squash
